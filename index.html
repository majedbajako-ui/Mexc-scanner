<!doctype html><html lang="ar" dir="rtl"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEXC Scanner</title><style>body{background:#0d1117;color:#eee;font-family:Arial;padding:15px}button,input{padding:10px;border-radius:9px;background:#161b22;color:#fff;border:1px solid #30363d} .card{background:#111820;border:1px solid #29333e;border-radius:12px;padding:12px;margin:9px 0}.top{display:flex;justify-content:space-between}.score{font-size:20px}.g{color:#45d483}.y{color:#f2c14e}.r{color:#ff6b6b}.bar{height:7px;background:#252c35;border-radius:9px;margin:8px 0}.fill{height:100%;background:#45d483}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px}small{color:#9da7b3}</style><h2>🔥 MEXC Futures Scanner</h2><p><small>نسخة تجريبية — لا تنفذ صفقات</small></p><button onclick="scan()">فحص الآن</button> الحد الأدنى <input id="min" value="60" type="number" min="0" max="100" style="width:55px"><div id="st">جاهز</div><div id="list"></div><script>async function scan(){st.textContent='⏳ فحص...';try{let d=await (await fetch('/api/scan',{cache:'no-store'})).json(),m=+min.value||0;let a=d.rows.filter(x=>x.score>=m).slice(0,50);st.textContent='✅ '+new Date(d.time*1000).toLocaleTimeString('ar-TR');list.innerHTML=a.map((x,i)=>{let c=x.score>=80?'r':x.score>=65?'y':'g';return `<div class=card><div class=top><b>${i+1}. ${x.symbol}</b><b class="score ${c}">${x.score}/100</b></div><div class=bar><div class=fill style="width:${x.score}%"></div></div><div class=grid><div>الحركة: <b>${x.pct.toFixed(2)}%</b></div><div>السعر: <b>${x.price}</b></div><div>24h Volume: <b>${x.vol.toLocaleString()}</b></div><div>${x.pct>=0?'📈 UP':'📉 DOWN'}</div></div></div>`}).join('')||'<div class=card>لا توجد نتائج فوق الحد.</div>'}catch(e){st.textContent='❌ '+e.message}}scan();setInterval(scan,30000)</script></html>
